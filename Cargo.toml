[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/orishamir/Israeli-Broker-Search"

# Versions shared by the packages, so they're set in one place.
[workspace.dependencies]
broker-fees = { path = "crates/core" }
rusty-money = { version = "0.5.1", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "serde-with-float"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "macros", "serde-human-readable"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
thiserror = "2.0.21"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "mul", "sum"] }

# Clippy's stricter, more opinionated lints too, for idiomatic Rust.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# For libraries published for others to call; these crates are internal.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Optimizes across all crates at once: WebAssembly 5% smaller and 4% faster
# (measured). opt-level = "s" would shrink it 9% more but run 13% slower.
[profile.release]
lto = true
codegen-units = 1
