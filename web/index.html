<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="כמה יישאר לכם בסוף, אחרי עמלות ומס: השקעה לטווח ארוך בבנקים ובבתי השקעות בישראל, בקופות גמל ובפוליסות חיסכון, וחיסכון לטווח קצר בפיקדון או בקרן כספית."
    />
    <meta name="theme-color" content="#0d0f14" />
    <title>כמה יישאר לכם בסוף</title>
    <!-- The preview a shared link gets in WhatsApp and the like. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="כמה יישאר לכם בסוף" />
    <meta
      property="og:description"
      content="כמה יישאר לכם בסוף, אחרי עמלות ומס: השקעה לטווח ארוך בבנקים ובבתי השקעות בישראל, בקופות גמל ובפוליסות חיסכון, וחיסכון לטווח קצר בפיקדון או בקרן כספית."
    />
    <meta property="og:url" content="https://orishamir.github.io/Israeli-Broker-Search/" />
    <meta property="og:image" content="https://orishamir.github.io/Israeli-Broker-Search/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The page's shape, drawn while the code and the WebAssembly download,
         with pulsing blocks where the words and numbers will be; main.ts fades
         it away once the app has drawn. Styled here, before any stylesheet has
         arrived, so its colors and spacing repeat app.css and App.svelte. -->
    <style>
      #skeleton {
        position: absolute;
        inset: 0 0 auto;
        z-index: 1;
        min-height: 100dvh;
        background: #0d0f14
          radial-gradient(1200px 500px at 20% -10%, rgb(123 155 255 / 0.08), transparent 70%);
        color: #e6e8ee;
        font-family:
          'Segoe UI Variable Text',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.45;
        pointer-events: none;
        transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
      }
      #skeleton.done {
        opacity: 0;
      }
      #skeleton header {
        padding: 20px 24px 0;
      }
      #skeleton h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.01em;
      }
      /* The two calculators' switch. */
      #skeleton .switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      #skeleton .switch .block {
        height: 58px;
        border-radius: 10px;
      }
      #skeleton .layout {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 20px;
        padding: 16px 24px 24px;
        align-items: start;
      }
      #skeleton .column,
      #skeleton .results {
        display: grid;
        gap: 16px;
      }
      #skeleton .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      #skeleton .card {
        display: grid;
        gap: 10px;
        align-content: start;
        padding: 14px 16px;
        border: 1px solid rgb(255 255 255 / 0.08);
        border-radius: 12px;
        background: #151820;
      }
      #skeleton .block {
        height: 14px;
        border-radius: 6px;
        background: #1d212c;
        animation: skeleton-pulse 1.4s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (width < 800px) {
        #skeleton header {
          padding: 16px 12px 0;
        }
        #skeleton .layout {
          grid-template-columns: minmax(0, 1fr);
          padding: 12px;
        }
        /* Inputs come first on phones, and fill the first screen. */
        #skeleton .results {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #skeleton,
        #skeleton .block {
          transition-duration: 0s;
          animation-duration: 0s;
        }
      }
    </style>
  </head>
  <body>
    <div id="skeleton" aria-hidden="true">
      <header>
        <h1>כמה יישאר לכם בסוף</h1>
        <div class="block" style="width: 32%; margin-top: 8px"></div>
        <div class="switch">
          <div class="block"></div>
          <div class="block"></div>
        </div>
      </header>
      <div class="layout">
        <div class="column">
          <div class="card">
            <div class="block" style="width: 30%"></div>
            <div class="block" style="height: 32px"></div>
            <div class="block" style="width: 80%"></div>
            <div class="block" style="width: 90%; height: 110px"></div>
          </div>
          <div class="card">
            <div class="block" style="width: 30%"></div>
            <div class="block" style="height: 32px"></div>
            <div class="block" style="width: 90%; height: 84px"></div>
          </div>
          <div class="card">
            <div class="block" style="width: 30%"></div>
            <div class="block" style="height: 36px"></div>
            <div class="block" style="height: 36px"></div>
            <div class="block" style="height: 36px"></div>
          </div>
          <div class="card">
            <div class="block" style="width: 30%"></div>
            <div class="block" style="height: 36px"></div>
            <div class="block" style="height: 36px"></div>
            <div class="block" style="height: 36px"></div>
          </div>
        </div>
        <div class="results">
          <div class="stats">
            <div class="card">
              <div class="block" style="width: 40%"></div>
              <div class="block" style="width: 70%; height: 24px"></div>
              <div class="block" style="width: 40%"></div>
            </div>
            <div class="card">
              <div class="block" style="width: 40%"></div>
              <div class="block" style="width: 70%; height: 24px"></div>
              <div class="block" style="width: 40%"></div>
            </div>
            <div class="card">
              <div class="block" style="width: 40%"></div>
              <div class="block" style="width: 70%; height: 24px"></div>
              <div class="block" style="width: 40%"></div>
            </div>
          </div>
          <div class="card">
            <div class="block"></div>
            <div class="block" style="height: 44px"></div>
            <div class="block" style="height: 44px"></div>
            <div class="block" style="height: 44px"></div>
            <div class="block" style="height: 44px"></div>
            <div class="block" style="height: 44px"></div>
            <div class="block" style="height: 44px"></div>
          </div>
          <div class="card">
            <div class="block" style="width: 40%; height: 30px"></div>
            <div class="block" style="height: 440px"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
